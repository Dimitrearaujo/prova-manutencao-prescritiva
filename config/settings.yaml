paths:
  raw_csv: data/raw/banner.csv
  docs_dir: data/docs
  processed_dir: data/processed
  index_dir: data/index
  knowledge_dir: data/knowledge
  database: data/prescritiva.db

ingest:
  # Rotulos como "cocked_rotor_2" sao campanhas de coleta do mesmo defeito.
  # A hipotese e validada em notebooks/01_eda.ipynb antes de ser aplicada.
  campaign_suffix_pattern: '_(\d+)$'
  # Estados de operacao que o enunciado define como "nao sao problemas".
  operational_states:
    - normal
    - baseline
    - teste
    - acelerando
    - motor_desligado

similarity:
  n_neighbors: 25
  # Vibracao escala com a rotacao: so comparamos eventos do mesmo regime.
  # O ensaio operou em 0, 500, 1000 e 2000 rpm, entao o pareamento e exato.
  # Acima deste percentil da distancia observada em validacao, o evento e
  # tratado como padrao nao reconhecido em vez de receber um palpite.
  reject_distance_percentile: 99.0
  min_consensus: 0.45

knowledge:
  ocr_dpi: 300
  ocr_min_confidence: 0.5
  chunk_chars: 900
  chunk_overlap: 150
  # Escopo = titulo + objetivo. A cobertura documental e decidida contra o
  # escopo, nunca contra o corpo, para nao casar mencao solta de um termo.
  scope_chars: 700
  coverage_min_score: 1.0
  retrieval_top_k: 4

# Protecoes do cadastro de documento novo, alem da validacao de nome, tamanho e
# PDF legivel que ja roda em prescritiva.knowledge.cadastro para qualquer envio.
cadastro:
  # null = cadastro aberto (conveniencia em desenvolvimento). Numa planta
  # segmentada isto e segredo da instalacao, nao do repositorio versionado,
  # entao o valor real chega por PRESCRITIVA_CADASTRO_KEY, nunca por aqui.
  chave_acesso: null
  # Abaixo disto o texto extraido (nativo ou OCR) nao sustenta um procedimento
  # consultavel - o documento entraria na base sem nunca poder cobrir defeito
  # nenhum. Mesmo minimo por pagina que decide entre texto nativo e OCR em
  # knowledge/extract.py: um PDF que nao passa nesse minimo tambem nao teria
  # texto de sobra depois do OCR.
  min_chars_por_pagina: 40

llm:
  provider: ollama
  model: qwen2.5:3b
  base_url: http://localhost:11434
  # Temperatura baixa: a tarefa e reescrever procedimento, nao criar.
  temperature: 0.1
  # Teto de tokens limita a latencia. Sem GPU cada token custa tempo real, e uma
  # resposta que divaga vira minutos de espera para o tecnico.
  max_tokens: 600
  num_ctx: 4096
  # Folgado de proposito: a primeira chamada carrega o modelo do disco e pode
  # levar mais de um minuto em maquina sem GPU.
  timeout_s: 300

# Integracao por fila com o chao de fabrica. O endereco do broker pode ser
# sobrescrito por PRESCRITIVA_MQTT_HOST, porque ele e da instalacao e nao da
# solucao.
mqtt:
  host: localhost
  port: 1883
  keepalive_s: 60
  # Topicos separados por proposito. Diagnostico e erro de integracao nao podem
  # sair pelo mesmo canal: quem consome precisa distinguir "nao reconheci o
  # padrao", que e resposta, de "nao entendi a mensagem", que e defeito de quem
  # publicou.
  topico_entrada: planta/vibracao/eventos
  topico_saida: planta/vibracao/diagnosticos
  topico_erros: planta/vibracao/diagnosticos/erros
  # Entrega ao menos uma vez. Numa planta, receber o mesmo diagnostico duas
  # vezes custa pouco; perder um custa uma parada nao explicada.
  qos: 1
  # Fixo de proposito: com sessao persistente, e o client_id que faz o broker
  # guardar as mensagens enquanto o servico esta reiniciando.
  client_id: prescritiva-consumidor
  reconexao_min_s: 1
  reconexao_max_s: 60
