[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prescritiva"
version = "0.1.0"
description = "Pipeline de Manutencao Prescritiva por similaridade historica e recuperacao documental"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
